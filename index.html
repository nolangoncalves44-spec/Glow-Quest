<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#140d2b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>Glow Quest</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#140d2b;--c1:#2a2152;--c2:#1f1840;--line:rgba(255,255,255,.08);--txt:#f3efff;--dim:#a49bc9;--pink:#ff7eb6;--pinkd:#c2477f;--vio:#9b7bff;--viod:#6a4fd1;--mint:#6ee7c8;--mintd:#2fa88a;--gold:#ffcf5a;--goldd:#d19a1d;--red:#ff6b7a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0}
html,body{height:100%;overflow:hidden;color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:14px;overscroll-behavior:none;user-select:none;-webkit-user-select:none}
body{background:radial-gradient(ellipse at 50% -10%,#3b2380 0,transparent 55%),radial-gradient(circle at 90% 80%,#1d2a66 0,transparent 45%),var(--bg)}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.5;background-image:radial-gradient(1px 1px at 20% 30%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 70% 12%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 85% 55%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 35% 75%,#fff 50%,transparent 51%),radial-gradient(1.5px 1.5px at 55% 45%,#ffcf5a 50%,transparent 51%),radial-gradient(1px 1px at 10% 90%,#fff 50%,transparent 51%)}
#app{position:relative;height:100vh;height:100dvh;height:var(--apph,100dvh);display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);max-width:520px;margin:0 auto}
header{flex:none;display:flex;align-items:center;gap:9px;padding:9px 14px 5px}
main{flex:1;min-height:0;display:flex;flex-direction:column;gap:9px;padding:6px 14px 8px}
nav{flex:none;display:flex;gap:4px;padding:6px 8px 7px;background:rgba(20,13,43,.92);border-top:1px solid var(--line)}
nav button{flex:1;min-width:0;background:none;border:0;border-radius:12px;color:var(--dim);font:inherit;font-size:9px;font-weight:800;letter-spacing:.02em;padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:3px;text-transform:uppercase}
nav button svg{width:20px;height:20px}
nav button.on{color:#fff;background:linear-gradient(180deg,var(--vio),var(--viod));box-shadow:0 3px 0 #3e2a8f}
.lvb{width:38px;height:42px;flex:none;display:grid;place-items:center;font-weight:900;font-size:15px;color:#1b0f33;background:linear-gradient(180deg,#ffe08a,var(--gold));clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
.xpw{flex:1;min-width:0}.xpw .t{display:flex;justify-content:space-between;gap:6px;white-space:nowrap;overflow:hidden;font-size:10px;font-weight:800;color:var(--dim);margin-bottom:3px;text-transform:uppercase;letter-spacing:.06em}
.xp{height:10px;background:#0d0820;border-radius:10px;overflow:hidden;box-shadow:inset 0 1px 2px #000}
.xp i{display:block;height:100%;border-radius:10px;background:linear-gradient(90deg,var(--vio),var(--pink));position:relative;transition:width .6s cubic-bezier(.2,1.4,.4,1)}
.xp i::after{content:"";position:absolute;left:4px;right:4px;top:2px;height:2px;border-radius:2px;background:rgba(255,255,255,.45)}
.pill{display:inline-flex;align-items:center;gap:4px;font-weight:900;font-size:13px;background:#0d0820;border-radius:20px;padding:4px 9px 4px 5px}
.coin{width:15px;height:15px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff3b8,var(--gold) 45%,var(--goldd));box-shadow:0 0 0 1.5px #a8740f inset;display:inline-block;flex:none}
.ib{background:none;border:0;color:var(--dim);padding:3px;display:flex}
.card{background:linear-gradient(180deg,var(--c1),var(--c2));border:1px solid var(--line);border-radius:16px;padding:11px 13px;box-shadow:0 4px 0 rgba(0,0,0,.3)}
.ttl{font-size:10px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:var(--vio)}
.dim{color:var(--dim)}.sm{font-size:11px}.b{font-weight:800}
.row{display:flex;align-items:center;gap:9px}.sb{justify-content:space-between}
.bar{height:10px;background:#0d0820;border-radius:10px;position:relative;box-shadow:inset 0 1px 2px #000}
.bar i{display:block;height:100%;border-radius:10px;background:linear-gradient(90deg,var(--pinkd),var(--pink));transition:width .6s cubic-bezier(.2,1.4,.4,1)}
.bar.ok i{background:linear-gradient(90deg,var(--mintd),var(--mint))}
.bar .mk{position:absolute;top:-3px;width:3px;height:16px;border-radius:2px;background:#fff;opacity:.7}
.btn{font:inherit;font-weight:900;font-size:13px;letter-spacing:.03em;border:0;border-radius:12px;padding:10px 14px;color:#2a0d1d;background:linear-gradient(180deg,#ff9cc8,var(--pink));box-shadow:0 4px 0 var(--pinkd);text-transform:uppercase}
.btn.v{color:#fff;background:linear-gradient(180deg,#b39bff,var(--vio));box-shadow:0 4px 0 var(--viod)}
.btn.m{color:#0b3328;background:linear-gradient(180deg,#9ff2dc,var(--mint));box-shadow:0 4px 0 var(--mintd)}
.btn.g{color:#3a2600;background:linear-gradient(180deg,#ffe08a,var(--gold));box-shadow:0 4px 0 var(--goldd)}
.btn.alt{color:var(--txt);background:#352a66;box-shadow:0 4px 0 #1d1540}
.btn.red{color:#fff;background:var(--red);box-shadow:0 4px 0 #a33545}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.4)}.btn[disabled]{opacity:.4;pointer-events:none}
.tag{font-size:10px;font-weight:900;padding:3px 8px;border-radius:20px;letter-spacing:.05em;text-transform:uppercase}
/* hero */
.hero{flex:none;display:flex;gap:10px;align-items:stretch}
.stage{position:relative;width:96px;flex:none;display:flex;align-items:flex-end;justify-content:center;border-radius:16px;background:radial-gradient(ellipse at 50% 85%,rgba(155,123,255,.45),transparent 65%)}
.stage::after{content:"";position:absolute;bottom:4px;width:54px;height:8px;border-radius:50%;background:rgba(0,0,0,.45)}
.ava{position:relative;z-index:1;display:block}
.hero .ava svg{height:min(160px,20vh);width:auto}
.ch .hb{transform-box:view-box;transform-origin:100px 30px;animation:sway 4.5s ease-in-out infinite}.ch .hf{transform-box:view-box;transform-origin:100px 30px;animation:sway 4.5s ease-in-out infinite reverse}
@keyframes sway{50%{transform:rotate(1.3deg)}}
.ch .ey{transform-box:fill-box;transform-origin:center;animation:blink 4.8s infinite}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}}
.sk .ch *{animation:none!important}
.ava svg{display:block;transform-origin:50% 100%;animation:idle 3s ease-in-out infinite}
@keyframes idle{50%{transform:translateY(-2px) scaleY(1.01)}}
.ava.jump svg{animation:jump .7s ease-out}
@keyframes jump{20%{transform:scale(1.06,.92)}50%{transform:translateY(-24px) scale(.96,1.05)}80%{transform:scale(1.05,.95)}}
.ava.tilt svg{animation:tilt .8s ease-in-out}@keyframes tilt{30%{transform:rotate(-8deg)}65%{transform:rotate(5deg)}}
.ava.sad svg{animation:sad .9s ease-in-out}@keyframes sad{20%,80%{transform:translateY(4px) scaleY(.95)}40%{transform:translateY(4px) scaleY(.95) translateX(-3px)}60%{transform:translateY(4px) scaleY(.95) translateX(3px)}}
.ava.dance svg{animation:dance 1.4s ease-in-out}@keyframes dance{15%{transform:translateY(-14px) rotate(-10deg)}30%{transform:none}45%{transform:translateY(-14px) rotate(10deg)}60%{transform:none}80%{transform:translateY(-22px) scale(1.08)}}
.ava.spin svg{animation:spin .7s ease-in-out}@keyframes spin{50%{transform:scaleX(-1) translateY(-8px)}}
.ava.wave svg{animation:wave .9s ease-in-out}@keyframes wave{20%,60%{transform:rotate(6deg)}40%,80%{transform:rotate(-6deg)}}
.bubble{position:absolute;left:58px;top:2px;z-index:3;background:#fff;color:#2a1a4a;font-size:11px;font-weight:800;padding:6px 9px;border-radius:12px 12px 12px 3px;white-space:nowrap;box-shadow:0 3px 0 rgba(0,0,0,.3);animation:pop .3s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.4);opacity:0}}
.spark{position:absolute;width:6px;height:6px;z-index:2;pointer-events:none;animation:spk .9s ease-out forwards;clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%)}
@keyframes spk{to{transform:translate(var(--x),var(--y)) scale(.2) rotate(180deg);opacity:0}}
.float{position:fixed;z-index:90;pointer-events:none;font-weight:900;font-size:16px;display:flex;align-items:center;gap:4px;animation:fl 1.1s ease-out forwards;text-shadow:0 2px 0 rgba(0,0,0,.5)}
@keyframes fl{20%{transform:translateY(-12px) scale(1.25)}100%{transform:translateY(-56px);opacity:0}}
.score{font-size:36px;font-weight:900;line-height:1;background:linear-gradient(180deg,#fff,#d9ccff);-webkit-background-clip:text;background-clip:text;color:transparent}
.score small{font-size:13px;color:var(--dim);-webkit-text-fill-color:var(--dim);font-weight:700}
.chips{display:flex;gap:4px;flex-wrap:nowrap}.chip{font-size:10px;white-space:nowrap;font-weight:800;background:#0d0820;border-radius:8px;padding:4px 7px;color:var(--dim)}.chip b{color:#fff}
/* list */
.list{flex:1;min-height:0;display:flex;flex-direction:column;gap:5px;overflow:hidden}
.mrow{flex:1 1 0;min-height:27px;max-height:50px;display:flex;align-items:center;gap:10px;background:linear-gradient(180deg,var(--c1),var(--c2));border:1px solid var(--line);border-radius:13px;padding:0 4px 0 9px;box-shadow:0 3px 0 rgba(0,0,0,.28);transition:transform .1s}
.mrow:active{transform:translateY(2px)}
.mrow.done{background:linear-gradient(180deg,#1f5a52,#16403c);border-color:rgba(110,231,200,.35)}
.mrow.part{background:linear-gradient(180deg,#5a4a1f,#3e3216);border-color:rgba(255,207,90,.35)}
.ck{width:24px;height:24px;flex:none;border-radius:8px;background:#0d0820;box-shadow:inset 0 2px 3px #000;display:grid;place-items:center;transition:.2s}
.mrow.done .ck{background:linear-gradient(180deg,#a8f5e0,var(--mint));box-shadow:0 0 10px var(--mint)}
.mrow.part .ck{background:linear-gradient(90deg,var(--gold) 50%,#0d0820 50%);box-shadow:none}
.ck svg{width:15px;height:15px;opacity:0}.mrow.done .ck svg{opacity:1}
.mname{flex:1;min-width:0;font-weight:800;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pts{font-size:11px;font-weight:900;color:var(--gold);white-space:nowrap}
.more{background:none;border:0;color:var(--dim);padding:8px 6px;display:flex;flex:none}
.nicon{width:12px;height:12px;flex:none;color:var(--gold)}
/* sheet & overlay */
#sheet{position:fixed;inset:0;z-index:80;background:rgba(5,2,15,.65);display:none;align-items:flex-end;justify-content:center}
#sheet.on{display:flex}
#sheet .in{width:100%;max-width:520px;background:linear-gradient(180deg,#2e2459,#1d1640);border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:92dvh;overflow:auto;animation:up .28s cubic-bezier(.2,1.3,.4,1)}
@keyframes up{from{transform:translateY(60px);opacity:0}}
#over{position:fixed;inset:0;z-index:120;display:none;align-items:center;justify-content:center;flex-direction:column;background:rgba(8,4,22,.85);overflow:hidden}
#over.on{display:flex}
#over .rays{position:absolute;width:160vmax;height:160vmax;background:repeating-conic-gradient(rgba(255,207,90,.13) 0 10deg,transparent 10deg 20deg);animation:rot 12s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
#over h1{position:relative;font-size:40px;font-weight:900;letter-spacing:.04em;color:var(--gold);text-shadow:0 4px 0 #a8740f,0 0 24px rgba(255,207,90,.6);animation:pop .5s cubic-bezier(.2,1.6,.4,1);text-align:center}
#over p{position:relative;margin-top:8px;font-weight:800;text-align:center}
textarea,input[type=text],input[type=number],select{width:100%;font:inherit;color:var(--txt);background:#0d0820;border:2px solid transparent;border-radius:12px;padding:10px;outline:none;user-select:text;-webkit-user-select:text}
textarea:focus,input:focus,select:focus{border-color:var(--vio)}
textarea{resize:none;height:84px}
/* shop */
.ctabs{display:flex;gap:5px;flex:none}
.ctabs button{flex:1;font:inherit;font-size:10px;font-weight:900;text-transform:uppercase;border:0;border-radius:10px;padding:7px 0;background:#0d0820;color:var(--dim)}
.ctabs button.on{background:linear-gradient(180deg,#ff9cc8,var(--pink));color:#2a0d1d;box-shadow:0 3px 0 var(--pinkd)}
.shopgrid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(3,1fr);gap:6px}
.sk{border-radius:12px;border:2px solid transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:3px 2px;min-height:0;overflow:hidden;position:relative;background:linear-gradient(180deg,var(--c1),var(--c2))}
.sk svg{flex:1;min-height:0;max-width:100%;width:100%}
.sk.sel{border-color:#fff;box-shadow:0 0 12px rgba(255,255,255,.35)}
.sk.lock svg{opacity:.45}
.sk .p{font-size:10px;font-weight:900;display:flex;align-items:center;gap:3px}
.sk .eq{position:absolute;top:4px;right:4px;width:8px;height:8px;border-radius:50%;background:var(--mint);box-shadow:0 0 6px var(--mint)}
.sk .rb{position:absolute;left:0;right:0;bottom:0;height:3px}
.pager{display:flex;align-items:center;justify-content:center;gap:14px;flex:none}
.pager button{background:#352a66;border:0;color:var(--txt);width:36px;height:30px;border-radius:9px;font:inherit;font-weight:900;box-shadow:0 3px 0 #1d1540}
.pager button[disabled]{opacity:.35}
/* misc */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;flex:none}
.tile{background:linear-gradient(180deg,var(--c1),var(--c2));border:1px solid var(--line);border-radius:13px;padding:8px 4px;text-align:center;box-shadow:0 3px 0 rgba(0,0,0,.28)}
.tile b{display:block;font-size:18px;font-weight:900}.tile span{font-size:9px;color:var(--dim);font-weight:800;text-transform:uppercase;letter-spacing:.04em}
.moods{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.moods button{font:inherit;font-weight:900;padding:9px 0;border:0;border-radius:9px;background:#0d0820;color:var(--dim)}
.moods button.on{color:#111;transform:translateY(-2px)}
.sw{width:40px;height:23px;border-radius:23px;background:#0d0820;position:relative;flex:none;transition:.2s;box-shadow:inset 0 1px 3px #000}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:17px;height:17px;border-radius:50%;background:var(--dim);transition:.2s}
.sw.on{background:var(--mintd)}.sw.on::after{left:20px;background:#fff}
.pips{display:flex;gap:5px}.pips i{width:18px;height:18px;border-radius:6px;background:#0d0820;display:block;box-shadow:inset 0 1px 2px #000}.pips i.on{background:linear-gradient(180deg,#ffe08a,var(--gold));box-shadow:0 0 8px var(--gold)}
.breath{width:150px;height:150px;margin:24px auto;border-radius:50%;background:radial-gradient(circle,rgba(110,231,200,.35),rgba(110,231,200,.05));border:3px solid var(--mint);display:grid;place-items:center;transform:scale(.7);font-weight:900;box-shadow:0 0 30px rgba(110,231,200,.4)}
.catrow{display:grid;grid-template-columns:1fr 58px 32px;gap:6px;margin-bottom:6px}
.catrow button{background:#352a66;border:0;border-radius:9px;color:var(--red);font-weight:900}
.upd{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom));z-index:110;background:linear-gradient(180deg,#ffe08a,var(--gold));color:#3a2600;font-weight:800;font-size:13px;padding:11px 16px;border-radius:14px;box-shadow:0 4px 0 var(--goldd);white-space:nowrap;animation:pop .4s cubic-bezier(.2,1.6,.4,1)}
.upd b{margin-left:8px;text-decoration:underline}
.ch{overflow:visible}
</style>
</head>
<body>
<div id="app"><header id="hud"></header><main id="view"></main><nav id="nav"></nav></div>
<div id="sheet"><div class="in" id="sheetIn"></div></div>
<div id="over"></div>
<input type="file" id="importFile" accept=".json,application/json" hidden>
<script>
"use strict";
/* ===================== CONSTANTES JEU ===================== */
const APP_VERSION="2.0.5";
const KEY="glowquest_v1";
const DEFAULT_CATS=[{id:"m0",name:"Te coucher avant 23 h"},{id:"m1",name:"Dormir au moins 7 h"},{id:"m2",name:"Te lever à l'heure prévue, sans répéter le réveil"},{id:"m3",name:"20 min de sport (marche rapide, vélo, danse)"},{id:"m4",name:"30 squats et 20 pompes"},{id:"m5",name:"Marcher 6 000 pas"},{id:"m6",name:"10 min d'étirements ou de yoga"},{id:"m7",name:"Boire 1,5 L d'eau"},{id:"m8",name:"Manger 2 fruits et 1 légume"},{id:"m9",name:"Cuisiner un repas maison"},{id:"m10",name:"Zéro soda et zéro sucrerie"},{id:"calme",name:"10 min de méditation ou de respiration"},{id:"m12",name:"Pas de téléphone 30 min au réveil"},{id:"m13",name:"Pas d'écran 30 min avant de dormir"},{id:"m14",name:"Routine de soin matin et soir"},{id:"m15",name:"Être prête (douche, tenue) avant 10 h"},{id:"m16",name:"Ranger ta chambre 15 min"},{id:"m17",name:"Une tâche ménagère (lessive, vaisselle...)"},{id:"m18",name:"Une action concrète vers ton objectif"},{id:"m19",name:"45 min de travail sans distraction"},{id:"m20",name:"Lire 20 pages"},{id:"m21",name:"Apprendre 15 min (langue, tuto...)"},{id:"journal",name:"Journal : 3 lignes et humeur"},{id:"m23",name:"Appeler ou voir un proche"},{id:"m24",name:"Faire un compliment sincère"},{id:"m25",name:"Sortir prendre l'air 20 min"},{id:"m26",name:"Planifier demain (3 priorités)"},{id:"m27",name:"Noter tes dépenses du jour"},{id:"m28",name:"Trier : donner ou jeter 5 objets"},{id:"m29",name:"15 min juste pour toi (loisir)"}];
const M_PER_DAY=5,M_PTS=20;
const SQ=["Boire un grand verre d'eau au réveil","Faire ton lit","Faire 15 squats","Gainage 30 s","Prendre les escaliers au lieu de l'ascenseur","2 min d'étirements du dos","Manger un fruit au goûter","Remplir ta gourde pour la journée","Ouvrir les fenêtres 5 min","Ranger 5 objets qui traînent","Vider et ranger ton sac","Arroser une plante","Sourire à 3 personnes","Envoyer un message gentil","Dire merci à quelqu'un","Écouter une chanson qui fait du bien","Danser sur une chanson","Écrire 1 gratitude","Noter 1 victoire du jour","1 min de respiration 4 s / 6 s","Regarder le ciel 2 min sans téléphone","Trier tes notifications","Supprimer 10 photos inutiles","Préparer ta tenue de demain","Téléphone hors de la chambre ce soir","Masque ou soin du visage","Crème pour les mains","Boire une tisane au calme","Lire 1 page d'un livre","Apprendre 1 mot nouveau"].map((t,i)=>({id:"q"+i,t}));
const WQ=[["3 matins sans téléphone",3],["Essayer un nouveau sport",1],["5 jours avec 1,5 L d'eau",5],["2 promenades de 30 min",2],["4 soirs couchée avant 23 h",4],
 ["3 séances de sport complètes",3],["Cuisiner 2 nouveaux repas",2],["1 soirée sans écran",1],["Appeler 2 proches",2],["5 journaux d'humeur",5]];
const LEAGUES=[["Bronze",0],["Argent",350],["Or",600],["Platine",850],["Diamant",1100],["Légende",1400]];
const TITLES=[[1,"Novice"],[5,"Apprentie"],[10,"Aventurière"],[20,"Guerrière"],[35,"Championne"],[50,"Héroïne"],[75,"Légende"]];
const PERFECT_XP=50,RETURN_XP=40,REST_PTS=5,WQ_XP=100,SQ_XP=15;
const DAILY=[[2,40],[5,30],[10,19],[20,10],[100,1]];
const DEFI_COINS=15,CHESTS=[[0,25],[1,75],[2,180],[3,400]];
const WHEEL=[{t:"1",c:1},{t:"Défi",d:1},{t:"2",c:2},{t:"Défi",d:1},{t:"5",c:5},{t:"Skin",s:1},{t:"10",c:10},{t:"Défi",d:1}];
const DEFIS=["Marcher 20 min","Boire 2 L d'eau","Zéro réseau social pendant 2 h","Faire 50 squats","Ranger un placard","Cuisiner un plat nouveau","Te coucher 30 min plus tôt","Écrire une lettre à ton toi du futur","Faire une bonne action en secret","10 min de méditation","Appeler un proche","Pas de sucre ajouté de la journée","Lire 30 pages","15 min d'étirements","Prendre en photo un beau moment"];
const COIN_MAIN=2,COIN_PART=1,COIN_SQ=5,COIN_PERFECT=10,COIN_WQ=20;

/* ===================== PERSONNAGE (ORIGINAL, VECTORIEL DETAILLE) ===================== */
const EYE="#8a5cf0",SKL="#b97f6c",WHITE="#f7f5fc";

   if(f==="bubbles")for(let i=0;i<6;i++){const px=x+R()*w,py=y+h,d=(2.6+R()*1.6).toFixed(2),b=(R()*3).toFixed(2);front+=`<circle cx="${px.toFixed(1)}" cy="${py}" r="${(1.5+R()*2).toFixed(1)}" fill="#ffffff" fill-opacity=".25" stroke="${col}" stroke-width=".6" opacity="0"><animate attributeName="cy" values="${py};${y}" dur="${d}s" begin="-${b}s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.9;0" dur="${d}s" begin="-${b}s" repeatCount="indefinite"/></circle>`}
   if(f==="stars"){const cy=y+h/2,rx=w*.6,ry=h*.18,pid=X.id+"o"+it.id;back+=`<path id="${pid}" d="M${100-rx},${cy} A${rx},${ry} 0 1,0 ${100+rx},${cy} A${rx},${ry} 0 1,0 ${100-rx},${cy}" fill="none"/>`;

 C.succ30=pc(d=>C.days[d].success);C.perf30=pc(d=>C.days[d].perfect);C.reg30=pc(d=>C.days[d].pct>=80);
 return C;
}

function chart(){
 const T=today(),W=300,H=150,n=30,bw=W/n;let bars="",pts=[];
 for(let i=0;i<n;i++){const d=addDays(T,i-n+1),x=C.days[d],X=i*bw;
  if(x){const bh=Math.max(2,x.pct/100*(H-6));bars+=`<rect x="${X+1}" y="${H-bh}" width="${bw-2}" height="${bh}" rx="2" fill="${x.perfect?"#ffcf5a":x.success?"#6ee7c8":"#4a3d80"}"/>`;if(x.mood)pts.push(`${X+bw/2},${H-x.mood/10*(H-6)}`)}
  else bars+=`<rect x="${X+1}" y="${H-2}" width="${bw-2}" height="2" fill="#2a2152"/>`}
 return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="width:100%;height:100%">${bars}${pts.length>1?`<polyline points="${pts.join(" ")}" fill="none" stroke="#ff7eb6" stroke-width="2.5" vector-effect="non-scaling-stroke"/>`:""}</svg>`;
}

function wheelSVG(rot){
 const cols=["#ff7eb6","#9b7bff","#6ee7c8","#9b7bff","#ffcf5a","#ff6b7a","#7cc4f5","#9b7bff"];let g="";
 WHEEL.forEach((w,i)=>{const a0=(i*45-90-22.5)*Math.PI/180,a1=((i+1)*45-90-22.5)*Math.PI/180,R=96;
  g+=`<path d="M100,100 L${(100+Math.cos(a0)*R).toFixed(1)},${(100+Math.sin(a0)*R).toFixed(1)} A${R},${R} 0 0,1 ${(100+Math.cos(a1)*R).toFixed(1)},${(100+Math.sin(a1)*R).toFixed(1)} Z" fill="${cols[i]}" stroke="#140d2b" stroke-width="2"/>`;
  const am=(i*45-90)*Math.PI/180;g+=`<text x="${(100+Math.cos(am)*62).toFixed(1)}" y="${(100+Math.sin(am)*62).toFixed(1)}" fill="#1b0f33" font-size="${w.c?18:12}" font-weight="900" text-anchor="middle" dominant-baseline="middle" transform="rotate(${i*45} ${(100+Math.cos(am)*62).toFixed(1)} ${(100+Math.sin(am)*62).toFixed(1)})" font-family="system-ui,sans-serif">${w.t}</text>`});
 return `<svg viewBox="0 0 200 200" style="width:100%;height:100%;overflow:visible"><g id="wheelG" style="transform-origin:100px 100px;transform:rotate(${rot}deg)">${g}<circle cx="100" cy="100" r="97" fill="none" stroke="#ffcf5a" stroke-width="4"/>${Array.from({length:16},(_,i)=>{const a=i*22.5*Math.PI/180;return`<circle cx="${(100+Math.cos(a)*97).toFixed(1)}" cy="${(100+Math.sin(a)*97).toFixed(1)}" r="2.6" fill="#fff"/>`}).join("")}</g>
 <circle cx="100" cy="100" r="16" fill="#ffcf5a" stroke="#a8740f" stroke-width="3"/><path d="M100,-6 L90,12 L110,12 Z" fill="#fff" stroke="#140d2b" stroke-width="2"/></svg>`;
}

 const remain=k=>{const all=[];for(const c in CAT())CAT()[c].forEach(it=>{if(it.r===k&&!/_none$/.test(it.id))all.push(it)});return[all.filter(it=>!S.owned.includes(it.id)).length,all.length]};

 ${r.defi?`<div class="card row sb" style="flex:none"><div style="min-width:0"><div class="ttl">Défi du jour</div><div class="b" style="margin-top:4px">${esc(r.defi.t)}</div></div>

 remTimers.forEach(clearTimeout);remTimers=[];

 <div class="row" style="gap:7px"><button class="btn m" data-act="export">Exporter</button><button class="btn alt" data-act="import">Importer</button><button class="btn red" data-act="reset">Effacer</button></div>
 ${NATIVE?`<button class="btn alt" style="width:100%;margin-top:14px" data-act="opentransfer">Récupérer la progression du navigateur</button>`:`<button class="btn g" style="width:100%;margin-top:14px" data-act="realapp">Installer la vraie app Android</button>`}<div class="sm dim" style="margin-top:14px;text-align:center">Glow Quest v${APP_VERSION}${NATIVE?" (app Android)":""}</div>`);
}
let breathT=null;const stopBreath=()=>{if(breathT){clearTimeout(breathT);breathT=null}};
function vBreath(){
 stopBreath();sheet(`<div style="text-align:center"><div class="ttl">Respiration guidée</div><div class="breath" id="bc">Prête ?</div><div id="bn" class="dim sm b">Cycle 0</div>
 <button class="btn v" style="width:100%;margin-top:16px" data-act="close">Terminer</button></div>`);
 let n=0;const el=document.getElementById("bc"),bn=document.getElementById("bn");
 const inh=()=>{n++;bn.textContent=`Cycle ${n} . ${n*10} s`;tone(392,0,1.2,"sine",.04,523);el.style.transition="transform 4s ease-in-out";el.style.transform="scale(1.1)";el.textContent="Inspire 4 s";breathT=setTimeout(exh,4000)};
 const exh=()=>{tone(523,0,1.6,"sine",.035,330);el.style.transition="transform 6s ease-in-out";el.style.transform="scale(.7)";el.textContent="Expire 6 s";breathT=setTimeout(inh,6000)};
 breathT=setTimeout(inh,700);
}
function overlay(title,sub,w,extra){
 const o=document.getElementById("over");o.innerHTML=`<div class="rays"></div><h1>${esc(title)}</h1>${w?`<div class="ava dance" style="position:relative;margin-top:14px">${charSVG(w,170)}</div>`:""}<p>${esc(sub||"")}</p>${extra||""}<p class="sm dim" style="margin-top:22px">Touche pour continuer</p>`;
 o.classList.add("on");o.onclick=()=>{o.classList.remove("on");o.innerHTML="";SFX.tap()};
}

/* ===================== EFFETS ===================== */
function floatAt(html,x,y,color){const f=document.createElement("div");f.className="float";f.innerHTML=html;f.style.left=(x-16)+"px";f.style.top=(y-18)+"px";if(color)f.style.color=color;document.body.appendChild(f);setTimeout(()=>f.remove(),1100)}
function sparks(n,colors){const st=document.getElementById("stage");if(!st)return;const w=st.clientWidth,h=st.clientHeight;
 for(let i=0;i<n;i++){const s=document.createElement("i");s.className="spark";const a=Math.random()*Math.PI*2,d=34+Math.random()*34;
  s.style.cssText=`left:${w/2}px;top:${h*.45}px;background:${colors[i%colors.length]};--x:${Math.cos(a)*d}px;--y:${Math.sin(a)*d-12}px;width:${5+Math.random()*6}px;height:${5+Math.random()*6}px`;st.appendChild(s);setTimeout(()=>s.remove(),900)}}
function countCoins(from,to){const el=document.getElementById("coinN");if(!el)return;const t0=performance.now(),D=500;
 const step=t=>{const k=Math.min(1,(t-t0)/D);el.textContent=nf(from+(to-from)*k);if(k<1)requestAnimationFrame(step)};requestAnimationFrame(step)}
function playFx(f){
 const ava=document.getElementById("ava"),b=document.getElementById("bubble");
 if(ava&&f.anim){ava.classList.add(f.anim);setTimeout(()=>ava.classList.remove(f.anim),1500)}
 if(b&&f.say){b.textContent=f.say;setTimeout(()=>{const bb=document.getElementById("bubble");if(bb)bb.textContent=bubbleText()},2600)}
 if(f.sparks)sparks(f.sparks,f.colors||["#6ee7c8","#ff7eb6","#ffcf5a","#fff"]);
 if(f.sound&&SFX[f.sound])SFX[f.sound]();
 if(f.coins){const chip=document.getElementById("coinChip").getBoundingClientRect();countCoins(f.coinFrom,f.coinFrom+f.coins);
  if(f.coins>0){floatAt(`+${f.coins} <i class="coin"></i>`,chip.left+12,chip.bottom+28,"#ffcf5a");setTimeout(SFX.coin,170)}}
 if(f.xp>0&&f.x)floatAt(`+${f.xp} XP`,f.x,f.y,"#b39bff");
 if(f.over)setTimeout(()=>{overlay(...f.over);if(f.overSound)SFX[f.overSound]()},f.overDelay||350);
 if(navigator.vibrate&&f.vib)try{navigator.vibrate(f.vib)}catch(e){}
}
const SAY={ok:["Bien joué !","Validé !","Une de plus !","Trop forte !","Continue !"],part:["C'est déjà ça !","Mieux que rien !","On avance !"],un:["Oups, annulé","Pas grave"]};
const pick=a=>a[Math.floor(Math.random()*a.length)];
function act(fn,ev,kind){
 const before=C||compute();fn();save();const after=compute();if(NATIVE&&after.today.success&&!before.today.success)try{Android.setDone(today())}catch(e){}
 const f={coins:after.coins-before.coins,coinFrom:before.coins,xp:after.total-before.total,x:ev&&ev.clientX,y:ev&&ev.clientY};
 const K={ok:["jump","ok",8,15],part:["tilt","part",0,10],un:["sad","un",0,0],quest:["wave","quest",10,15],rest:["tilt","equip",0,0]}[kind];
 if(K){f.anim=K[0];f.sound=K[1];f.sparks=K[2];f.vib=K[3];f.say=kind==="quest"?"Quête accomplie !":kind==="rest"?"Repos bien mérité":SAY[kind]?pick(SAY[kind]):null}
 if(after.today.success&&!before.today.success){f.anim="jump";f.say="Jour validé, série sauvée !";f.sparks=14;f.sound="quest"}
 if(after.today.perfect&&!before.today.perfect){f.anim="dance";f.say="Journée parfaite !";f.sparks=22;f.sound="perfect";f.vib=[20,40,20];f.over=["JOURNÉE PARFAITE",`+${PERFECT_XP} XP . +${COIN_PERFECT} pièces`,W()]}
 if(after.level>before.level){f.over=[`NIVEAU ${after.level}`,titleOf(after.level),W()];f.overSound="level";f.overDelay=f.sound==="perfect"?900:350}
 fx=f;render();
}

/* ===================== EVENEMENTS ===================== */
function setStatus(id,s){const r=dayRec(today()),e=r.m[id]||{s:0,note:""};e.s=s;e.pts=M_PTS;r.m[id]=e}
document.addEventListener("click",ev=>{
 const el=ev.target.closest("[data-act]");if(!el)return;const a=el.dataset.act,v=el.dataset.v,T=today();ac();
 if(a==="detail"){ev.stopPropagation();SFX.tap();vDetail(v);return}
 switch(a){
  case"tab":if(tab!==v){tab=v;shopSel=null;SFX.tap();render()}break;
  case"settings":SFX.tap();vSettings();break;
  case"sound":S.settings.sound=!S.settings.sound;save();SFX.tap();if(document.getElementById("sheet").classList.contains("on"))vSettings();render();break;
  case"close":SFX.tap();closeSheet();render();break;
  case"breath":SFX.tap();vBreath();break;
  case"toggle":{const e=dayRec(T).m[v],was=e?e.s:0;act(()=>setStatus(v,was===2?0:2),ev,was===2?"un":"ok");break}
  case"setS":{const s=+el.dataset.s,was=(dayRec(T).m[v]||{s:0}).s;if(s===was)break;closeSheet();act(()=>setStatus(v,s),ev,s===2?"ok":s===1?"part":"un");break}
  case"rest":{const r=dayRec(T),used=Object.keys(S.days).some(d=>d!==T&&weekKey(d)===weekKey(T)&&S.days[d].rest);
   if(!r.rest&&used){fx={anim:"sad",say:"Déjà pris cette semaine",sound:"err"};render();break}act(()=>{r.rest=!r.rest},ev,r.rest?"un":"rest");break}
  case"sq":{const r=dayRec(T),on=!!r.sq[v];act(()=>{if(on)delete r.sq[v];else r.sq[v]=true},ev,on?"un":"quest");break}
  case"remn":S.settings.remN=+v;save();SFX.tap();{const e=document.getElementById("remP");if(e)e.innerHTML=remPicker(+v)}if(S.settings.rem)remSync();break;
  case"remon":remEnable(S.settings.remN).then(ok=>{closeSheet();render();if(ok)toast("Rappels activés")});break;
  case"remtoggle":if(S.settings.rem){S.settings.rem=false;save();remSync();vSettings()}else remEnable().then(()=>vSettings());break;
  case"pwainst":if(installEvt){installEvt.prompt();installEvt=null}closeSheet();break;
  case"sendapp":sendToApp();break;
  case"opentransfer":try{Android.openTransfer()}catch(e){}closeSheet();break;
  case"doimport":doImport();break;
  case"realapp":vRealApp();break;
  case"gender":S.gender=v;save();SFX.equip();closeSheet();shopSel=null;fx={anim:"spin",sparks:12};render();setTimeout(startPrompts,400);break;
  case"setgender":vGender();break;
  case"spin":doSpin();break;
  case"defi":{const r=dayRec(T);if(!r.defi)break;act(()=>{r.defi.done=!r.defi.done},ev,r.defi.done?"un":"quest");break}
  case"chest":{const k=+v,p=CHESTS[k][1];if(C.coins<p){SFX.err();toast("Pas assez de pièces");break}const it=grantRandom(k);if(!it){SFX.err();toast("Tout est déjà débloqué");break}S.spent+=p;save();render();
   const pool=[];for(const c in CAT())CAT()[c].forEach(x=>{if(x.r===k&&!/_none$/.test(x.id))pool.push(x)});const cards=Array.from({length:52},()=>itemCard(pool[Math.floor(Math.random()*pool.length)]));const win=44;cards[win]=itemCard(it);
   openReel(cards,win,()=>rewardOverlay(it,"COFFRE OUVERT !"));break}
  case"dchest":{const r=dayRec(T);if(r.dchest){SFX.err();break}const val=rollDaily(),before=C.coins;r.dchest=val;save();render();
   const cards=Array.from({length:52},()=>coinCard(rollDaily()));const win=44;cards[win]=coinCard(val);
   openReel(cards,win,()=>{const o=document.getElementById("over");o.classList.remove("on");o.innerHTML="";C=compute();render();countCoins(before,C.coins);
    if(val>=100){overlay("JACKPOT !",`+${val} pièces`,W());SFX.legend()}else{toast(`+${val} pièces`);SFX.coin()}});break}
  case"mreroll":act(()=>{const r=dayRec(T);r.mr=(r.mr||0)+1;r.ml=null;mList(T)},ev,"part");break;
  case"reroll":act(()=>{const r=dayRec(T);r.rr=(r.rr||0)+1;r.sqList=null;r.sq={}},ev,"part");break;
  case"wq":{const q=weekQuest(C.curWk),was=!!q.w.doneDate;act(()=>{q.w.n=Math.max(0,Math.min(q.target,q.w.n+(+v)));if(q.w.n>=q.target&&!q.w.doneDate)q.w.doneDate=T;else if(q.w.n<q.target)q.w.doneDate=null},ev,+v>0?"part":"un");
   if(!was&&q.w.doneDate){SFX.perfect();overlay("QUÊTE ACCOMPLIE",`+${COIN_WQ} pièces . +${WQ_XP} XP`,W())}break}
  case"mood":act(()=>{dayRec(T).mood=+v;autoJournal()},ev,+v>=6?"ok":"part");break;
  case"jsave":{const r=dayRec(T);if(!r.mood||r.j.some(l=>!l.trim())){SFX.err();floatAt("Humeur + 3 lignes",ev.clientX-50,ev.clientY,"#ff7eb6");break}act(()=>{r.jd=1;autoJournal()},ev,"ok");floatAt(r.m.journal?"Journal + mission validés":"Journal validé",ev.clientX-60,ev.clientY-20,"#6ee7c8");break}
  case"jpast":vJPast();break;
  case"scat":shopCat=v;shopPage=0;shopSel=null;SFX.page();render();break;
  case"pick":shopSel=v;fx={anim:"spin",sound:"page"};render();break;
  case"page":{const n=Math.ceil(CAT()[shopCat].length/15);shopPage=Math.max(0,Math.min(n-1,shopPage+(+v)));SFX.page();render();break}
  case"buy":{const it=ITEM[v];if(!it||C.coins<it.price||S.owned.includes(v)){SFX.err();break}const from=C.coins;S.spent+=it.price;S.owned.push(v);W()[it.cat]=v;save();
   fx={anim:"dance",sparks:24,coins:-it.price,coinFrom:from,sound:it.r===3?"legend":"buy",vib:[20,40,20],colors:[RARITY[it.r][1],"#fff"]};
   if(it.r>=2){const w=Object.assign({},W());fx.over=[it.r===3?"LÉGENDAIRE !":"ÉPIQUE !",it.name,w];fx.overDelay=500}render();break}
  case"equip":W()[ITEM[v].cat]=v;save();fx={anim:"spin",sparks:10,sound:"equip"};render();break;
  case"compet":S.settings.compet=!S.settings.compet;save();SFX.tap();vSettings();break;
  case"catdel":if(S.cats.length>M_PER_DAY&&confirm("Supprimer cette mission ?")){S.cats.splice(+v,1);dayRec(T);save();vSettings()}break;
  case"catadd":S.cats.push({id:"c"+Date.now().toString(36),name:"Nouvelle mission"});dayRec(T);save();SFX.tap();vSettings();break;
  case"export":{if(NATIVE){const ok=Android.saveFile("glowquest-sauvegarde-"+T+".json",JSON.stringify(S));toast(ok?"Enregistré dans Téléchargements":"Échec de l'export");break}const b=new Blob([JSON.stringify(S)],{type:"application/json"}),u=URL.createObjectURL(b),l=document.createElement("a");l.href=u;l.download="glowquest-sauvegarde-"+T+".json";document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);break}
  case"import":document.getElementById("importFile").click();break;
  case"reset":if(confirm("Effacer toute la progression ?")&&confirm("Action définitive. Confirmer ?")){try{localStorage.removeItem(KEY)}catch(e){}S=null;load();save();closeSheet();render()}break;
 }
});
document.getElementById("sheet").addEventListener("click",ev=>{if(ev.target.id==="sheet"){closeSheet();render()}});
const COIN_JOURNAL=2;function jFull(r){return !!(r&&r.jd&&r.mood&&r.j&&r.j.length>=3&&r.j.every(l=>(l||"").trim()))}
function autoJournal(){const r=dayRec(today());if((r.ml||[]).includes("journal")&&r.mood&&r.j.every(l=>l.trim()))r.m.journal={s:2,note:"",pts:M_PTS}}
document.addEventListener("input",ev=>{
 const t=ev.target,T=today();
 if(t.dataset.note){const r=dayRec(T),id=t.dataset.note;if(!r.m[id])r.m[id]={s:0,note:"",pts:M_PTS};r.m[id].note=t.value;save()}
 else if(t.dataset.j!=null){dayRec(T).j[+t.dataset.j]=t.value;save()}
 else if(t.dataset.set){S.settings.threshold=Math.max(10,Math.min(100,+t.value||60));save()}
 else if(t.dataset.cat!=null){const c=S.cats[+t.dataset.cat],f=t.dataset.f;c[f]=t.value;dayRec(T);save();const e=document.getElementById("tot");if(e)e.textContent=S.cats.reduce((a,c)=>a+(+c.pts||0),0)}
});
document.getElementById("importFile").addEventListener("change",ev=>{
 const f=ev.target.files[0];if(!f)return;const rd=new FileReader();
 rd.onload=()=>{try{const d=JSON.parse(rd.result);if(!d.days||!d.cats)throw 0;S=d;save();load();save();closeSheet();render();alert("Sauvegarde importée.")}catch(e){alert("Fichier invalide.")}};rd.readAsText(f);ev.target.value="";
});
let lastDay=today();
document.addEventListener("visibilitychange",()=>{if(!document.hidden){lastDay=today();render()}});
setInterval(()=>{if(today()!==lastDay){lastDay=today();render()}},60000);
/* ===================== MISE A JOUR (service worker) ===================== */
if("serviceWorker" in navigator&&location.protocol.startsWith("http")){
 navigator.serviceWorker.register("sw.js",{updateViaCache:"none"}).then(reg=>{
  const ask=w=>{const b=document.createElement("div");b.className="upd";b.innerHTML="Nouvelle version disponible <b>Mettre à jour</b>";
   b.onclick=()=>{try{const blob=new Blob([JSON.stringify(S)],{type:"application/json"});localStorage.setItem(KEY+"_backup",JSON.stringify(S))}catch(e){}w.postMessage("skip")};document.body.appendChild(b)};
  if(reg.waiting&&navigator.serviceWorker.controller)ask(reg.waiting);
  reg.addEventListener("updatefound",()=>{const w=reg.installing;w.addEventListener("statechange",()=>{if(w.state==="installed"&&navigator.serviceWorker.controller)ask(w)})});
  setInterval(()=>reg.update(),3600000);document.addEventListener("visibilitychange",()=>{if(!document.hidden)reg.update()});
 });
 let reloaded=false;navigator.serviceWorker.addEventListener("controllerchange",()=>{if(!reloaded){reloaded=true;location.replace(location.pathname.replace(/index\.html$/,"")+"?r="+Date.now())}});
}
function fitApp(){const h=(window.visualViewport?visualViewport.height:innerHeight);document.documentElement.style.setProperty("--apph",Math.round(h)+"px")}
fitApp();addEventListener("resize",fitApp);addEventListener("orientationchange",()=>setTimeout(fitApp,300));addEventListener("pageshow",fitApp);if(window.visualViewport)visualViewport.addEventListener("resize",fitApp);setTimeout(fitApp,500);setTimeout(fitApp,1500);
if(/[?&]r=/.test(location.search))history.replaceState(null,"",location.pathname);
load();save();render();
function startPrompts(){if(location.search.includes("transfer=1")&&!NATIVE){history.replaceState(null,"",location.pathname);vSendAsk()}
  else if(NATIVE&&!S.settings.transferAsked&&isFresh())setTimeout(()=>{if(isFresh()&&!S.settings.transferAsked)vTransferAsk()},2500)
  else if(!NATIVE&&isStandalone()&&isAndroid&&!S.settings.realAsked)vRealApp()
  else if((NATIVE||(isStandalone()&&"Notification" in window))&&!S.settings.remAsked)vRemAsk()}
setTimeout(()=>{remSync();installBtn();if(!S.gender)vGender();else startPrompts()},1500);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)remSync()});
</script>

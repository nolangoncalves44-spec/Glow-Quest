name: Android APK
on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Clé de signature
        run: |
          if [ -z "${{ secrets.ANDROID_KEYSTORE_B64 }}" ]; then echo "Secret ANDROID_KEYSTORE_B64 manquant"; exit 1; fi
          echo "${{ secrets.ANDROID_KEYSTORE_B64 }}" | base64 -d > android/app/release.jks
      - name: Compilation
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: "1.${{ github.run_number }}"
        run: gradle -p android assembleRelease --no-daemon
      - run: cp android/app/build/outputs/apk/release/app-release.apk GlowQuest.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: android
          name: Glow Quest Android
          body: Fichier d'installation Android de Glow Quest.
          files: GlowQuest.apk
          make_latest: true
